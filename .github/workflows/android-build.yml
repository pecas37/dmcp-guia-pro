name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        uses: actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Instalar Rust y los targets de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Limpiar carpeta Android previa
        run: rm -rf src-tauri/gen/android

      - name: Inicializar proyecto Android de Tauri
        run: npm run tauri android init --ci

      - name: Copiar iconos personalizados a Android
        run: |
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      # --- SOLUCIÓN: Pre-descargar Gradle oficial con reintentos y más tiempo ---
      - name: Pre-descargar distribución de Gradle
        run: |
          cd src-tauri/gen/android
          # Extraer la URL oficial del wrapper
          GRADLE_URL=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2 | sed 's/\\//g')
          echo "URL de descarga: $GRADLE_URL"
          # Descargar con reintentos (3 intentos) y timeout de 5 minutos
          for i in {1..3}; do
            echo "Intento $i de descarga..."
            if curl -L --retry 2 --connect-timeout 30 --max-time 300 -o gradle-download.zip "$GRADLE_URL"; then
              echo "Descarga exitosa."
              # Sobrescribir el archivo de distribución para que Gradle use el que descargamos
              # (Opcional, pero ayuda a que no vuelva a intentar descargar)
              break
            else
              echo "Intento $i falló. Reintentando en 10 segundos..."
              sleep 10
            fi
          done
          # Si la descarga falló, aumentamos el timeout del wrapper
          if [ ! -f gradle-download.zip ]; then
            echo "La pre-descarga falló. Aumentando timeout del wrapper..."
            sed -i 's/networkTimeout=.*/networkTimeout=60000/' gradle/wrapper/gradle-wrapper.properties
          fi
          # Limpiar el archivo de descarga para no ocupar espacio
          rm -f gradle-download.zip

      - name: Configurar Gradle para GitHub Actions
        run: |
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> src-tauri/gen/android/gradle.properties
          echo "org.gradle.workers.max=2" >> src-tauri/gen/android/gradle.properties

      - name: Compilar APK de Android
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleUniversalRelease --stacktrace --info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: dmpc-pro-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
