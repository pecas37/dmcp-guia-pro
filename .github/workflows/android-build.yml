name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias de Node
        run: npm ci

      # --- CORRECCIÓN 1: Usar JDK 21 para mayor compatibilidad con Gradle moderno ---
      # Gradle 8+ (que usa Tauri v2) funciona mucho mejor con Java 21 en GitHub Actions.
      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Instalar Rust y los targets de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ESTE PASO LIMPIA CUALQUIER CARPETA ANDROID PREVIA PARA EVITAR CONFLICTOS
      - name: Limpiar carpeta Android previa
        run: rm -rf src-tauri/gen/android

      - name: Inicializar proyecto Android de Tauri
        run: npm run tauri android init --ci

      # ESTE PASO COPIA TUS ICONOS PERSONALIZADOS
      - name: Copiar iconos personalizados a Android
        run: |
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      # --- CORRECCIÓN 2: Añadir configuración para Gradle ---
      # Esto evita que Gradle falle por problemas de memoria o permisos.
      - name: Compilar APK de Android
        run: npm run tauri android build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          # Aumentar la memoria para Gradle
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: dmpc-pro-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
