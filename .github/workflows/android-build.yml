name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Instalar Rust y los targets de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Limpiar carpeta Android previa
        run: rm -rf src-tauri/gen/android

      - name: Inicializar proyecto Android de Tauri
        run: npm run tauri android init --ci

      - name: Copiar iconos personalizados a Android
        run: |
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      # --- SOLUCIÓN DEFINITIVA: Descargar Gradle manualmente con reintentos ---
      - name: Descargar Gradle manualmente
        run: |
          cd src-tauri/gen/android
          # Extraer la versión de Gradle del wrapper
          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
          echo "Versión de Gradle: $GRADLE_VERSION"

          # Descargar el archivo con reintentos y tiempo de espera largo
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "Descargando desde: $GRADLE_URL"

          for i in {1..5}; do
            echo "Intento $i de descarga..."
            if curl -L --retry 3 --connect-timeout 30 --max-time 600 -o gradle-download.zip "$GRADLE_URL"; then
              echo "Descarga exitosa."
              break
            else
              echo "Intento $i falló. Esperando 15 segundos..."
              sleep 15
            fi
          done

          if [ ! -f gradle-download.zip ]; then
            echo "ERROR: No se pudo descargar Gradle después de 5 intentos."
            exit 1
          fi

          # Modificar el wrapper para que use el archivo local descargado
          # Convertir la ruta a formato file:///
          LOCAL_PATH=$(pwd)/gradle-download.zip
          sed -i "s|distributionUrl=.*|distributionUrl=file://${LOCAL_PATH}|" gradle/wrapper/gradle-wrapper.properties
          echo "Configuración del wrapper actualizada:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Gradle para GitHub Actions
        run: |
          echo "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" >> src-tauri/gen/android/gradle.properties
          echo "org.gradle.workers.max=2" >> src-tauri/gen/android/gradle.properties

      - name: Compilar APK de Android
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleUniversalRelease --stacktrace --info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: dmpc-pro-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
