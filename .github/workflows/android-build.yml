name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android NDK
        run: |
          sdkmanager --install "ndk;27.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.0" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.0" >> $GITHUB_ENV

      - name: Instalar Rust y los targets de Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Forzar creación de carpeta Android
        run: mkdir -p src-tauri/gen/android

      - name: Inicializar proyecto Android de Tauri
        run: npm run tauri android init --ci

      - name: Compilar APK de Android
        run: npm run tauri android build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: dmpc-pro-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7